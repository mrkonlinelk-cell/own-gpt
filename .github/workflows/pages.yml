name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Assemble the site
        run: |
          mkdir -p _site/model
          cp -a web/. _site/
          if [ -f model/tokenizer.json ]; then cp model/tokenizer.json _site/model/; fi
          if [ -f model/model.onnx ]; then cp model/model.onnx _site/model/; fi
          if [ -f model/meta.json ]; then cp model/meta.json _site/model/; fi
          node scripts/vendor-ort.mjs --dest _site/js/ort
          ls -lh _site/model _site/js/ort _site/js/ort/legacy || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
